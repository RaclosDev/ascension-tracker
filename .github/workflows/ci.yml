name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Semanal: escanea las imagenes Docker aunque nadie toque sus ficheros (CVEs nuevos de la base).
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Minimo privilegio: el GITHUB_TOKEN solo puede leer el repo.
permissions:
  contents: read

# Un push nuevo a una PR cancela la ejecucion anterior de esa PR; en main no se cancela nada.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide que partes hay que verificar. Un job omitido por su "if" cuenta como superado
  # en la proteccion de rama, asi que "Backend CI" y "Frontend CI" siguen siendo obligatorios.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          all() { echo "backend=true"; echo "frontend=true"; echo "images=true"; }
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            all >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "$files"
          shared='^(\.github/workflows/ci\.yml|\.trivyignore|docker-compose\.yml|scripts/.*)$'
          has() { echo "$files" | grep -qE "$1|$shared" && echo true || echo false; }
          echo "backend=$(has '^backend/')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^frontend/')" >> "$GITHUB_OUTPUT"
          # Produccion no usa estas imagenes (Heroku y Vercel compilan por su cuenta): solo se
          # construyen si cambia algo que las afecta, y siempre en main y en el escaneo semanal.
          if [ "$EVENT" = "push" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=$(has '^(backend/(Dockerfile|pom\.xml|\.dockerignore)|frontend/(Dockerfile|package(-lock)?\.json|nginx\.conf|security-headers\.conf|\.dockerignore)|docker-compose\.yml)$')" >> "$GITHUB_OUTPUT"
          fi

  # Los jobs de cada parte corren en paralelo; "Backend CI" y "Frontend CI" los resumen.
  backend-test:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test and Package Backend (Maven)
        working-directory: backend
        run: |
          # La descarga del wrapper de Maven falla a veces: se reintenta antes de compilar.
          for attempt in 1 2 3; do ./mvnw -B -v > /dev/null && break; sleep 15; done
          ./mvnw -B verify

  backend-scan:
    name: Backend dependency scan
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Maven Dependencies (Trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Backend Docker Image
        working-directory: backend
        run: docker build -t ascension-api:latest .

      - name: Scan Backend Docker Image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ascension-api:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

  # Check obligatorio en la proteccion de rama: resume los jobs en paralelo de arriba.
  backend:
    name: Backend CI
    if: always()
    needs: [changes, backend-test, backend-scan, backend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test "$CHANGES" = success
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then exit 1; fi
          done

  frontend-checks:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Security Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Lint, Typecheck and Test Frontend
        working-directory: frontend
        run: |
          npm run check:csp
          npm run lint
          npm run knip
          npm run typecheck
          npm run test:coverage
          npm run build
          node scripts/check-build-budgets.mjs

  # Los E2E se reparten en tres runners; el cuarto compila y prueba la build de produccion.
  frontend-e2e:
    name: Frontend E2E (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1/3
            run: npx playwright test --shard=1/3
          - name: 2/3
            run: npx playwright test --shard=2/3
          - name: 3/3
            run: npx playwright test --shard=3/3
          - name: production build
            run: npm run build && npx playwright test --config playwright.production.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: ${{ matrix.run }}

  frontend-image:
    name: Frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Frontend Docker Image
        working-directory: frontend
        run: docker build --build-arg VITE_API_URL= --build-arg VITE_GOOGLE_CLIENT_ID=ci-mock-id -t ascension-frontend:latest .

      - name: Scan Frontend Docker Image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ascension-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

  # Check obligatorio en la proteccion de rama: resume los jobs en paralelo de arriba.
  frontend:
    name: Frontend CI
    if: always()
    needs: [changes, frontend-checks, frontend-e2e, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test "$CHANGES" = success
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then exit 1; fi
          done

  quality-gate:
    name: Quality gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND" = success
          test "$FRONTEND" = success
