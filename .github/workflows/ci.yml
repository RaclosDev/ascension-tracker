name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Minimo privilegio: el GITHUB_TOKEN solo puede leer el repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and Test Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          
      - name: Cache Playwright Browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        
      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Build Backend (Maven)
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Build Backend Docker Image
        working-directory: backend
        run: docker build -t ascension-api:latest .

      - name: Build Frontend Docker Image
        working-directory: frontend
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_GOOGLE_CLIENT_ID=ci-mock-id -t ascension-frontend:latest .
