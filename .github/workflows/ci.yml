name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Semanal: escanea las imagenes Docker aunque nadie toque sus ficheros (CVEs nuevos de la base).
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Minimo privilegio: el GITHUB_TOKEN solo puede leer el repo.
permissions:
  contents: read

# Un push nuevo a una PR cancela la ejecucion anterior de esa PR; en main no se cancela nada.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide que partes hay que verificar. Un job omitido por su "if" cuenta como superado
  # en la proteccion de rama, asi que "Backend CI" y "Frontend CI" siguen siendo obligatorios.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          all() { echo "backend=true"; echo "frontend=true"; echo "images=true"; }
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            all >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "$files"
          shared='^(\.github/workflows/ci\.yml|\.trivyignore)$'
          has() { echo "$files" | grep -qE "$1|$shared" && echo true || echo false; }
          echo "backend=$(has '^backend/')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^frontend/')" >> "$GITHUB_OUTPUT"
          # Produccion no usa estas imagenes (Heroku y Vercel compilan por su cuenta): solo se
          # construyen si cambia algo que las afecta, y siempre en main y en el escaneo semanal.
          if [ "$EVENT" = "push" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=$(has '^(backend/(Dockerfile|pom\.xml|\.dockerignore)|frontend/(Dockerfile|package(-lock)?\.json|nginx\.conf|security-headers\.conf|\.dockerignore)|docker-compose\.yml)$')" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test and Package Backend (Maven)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Scan Maven Dependencies (Trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Build Backend Docker Image
        if: needs.changes.outputs.images == 'true'
        working-directory: backend
        run: docker build -t ascension-api:latest .

      - name: Scan Backend Docker Image (Trivy)
        if: needs.changes.outputs.images == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ascension-api:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Security Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Lint, Typecheck and Test Frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Build Frontend Docker Image
        if: needs.changes.outputs.images == 'true'
        working-directory: frontend
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_GOOGLE_CLIENT_ID=ci-mock-id -t ascension-frontend:latest .

      - name: Scan Frontend Docker Image (Trivy)
        if: needs.changes.outputs.images == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ascension-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
