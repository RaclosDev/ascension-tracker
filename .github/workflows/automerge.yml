name: Auto-merge de PRs propios

# Los PR que abre el dueño del repo se fusionan solos (squash) cuando terminan en verde todos los
# checks obligatorios. Los de cualquier otra persona o bot (Dependabot incluido) siguen esperando
# una fusión manual.
#
# Se evalúa al terminar la CI y al terminar CodeQL: el último de los dos en acabar es el que fusiona.
# Lo que fusiona el GITHUB_TOKEN no dispara eventos (ni el push a main ni el borrado automático de
# la rama), así que este mismo job borra la rama y lanza la CI de main.
on:
  workflow_run:
    workflows: [CI/CD Pipeline, CodeQL Analysis]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Fusionar, borrar la rama y lanzar la CI de main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number,author,isDraft,headRefOid \
            --jq ".[] | select(.author.login == \"$OWNER\" and (.isDraft | not) and .headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "Nada que fusionar: PR ajeno, en borrador, ya fusionado o con commits más nuevos."
            exit 0
          fi
          if ! gh pr checks "$pr" --required; then
            echo "Quedan checks obligatorios sin terminar en verde: fusionará el workflow que falta."
            exit 0
          fi
          # El ruleset exige la rama al día con main. Si otro PR entró antes, no es un fallo de este
          # workflow: se avisa y termina en verde; al actualizar la rama, su CI volverá a decidir.
          for _ in $(seq 1 10); do
            status=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$status" != "UNKNOWN" ] && break
            sleep 3
          done
          if [ "$status" = "BEHIND" ] || [ "$status" = "DIRTY" ]; then
            echo "::notice title=PR #$pr sin fusionar::La rama está por detrás de main o tiene conflictos ($status). Actualízala y se fusionará sola cuando la CI pase."
            exit 0
          fi
          if ! gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"; then
            sleep 5
            estado=$(gh pr view "$pr" --json state,mergeStateStatus,headRefOid \
              --jq '[.state, .mergeStateStatus, .headRefOid] | join(" ")')
            read -r state status head <<< "$estado"
            if [ "$state" = "MERGED" ] || [ "$status" = "BEHIND" ] || [ "$status" = "DIRTY" ] || [ "$head" != "$SHA" ]; then
              echo "::notice::PR #$pr no fusionado por este job ($state, $status): ya fusionado, por detrás de main o con commits nuevos."
              exit 0
            fi
            echo "::error::No se pudo fusionar el PR #$pr ($state, $status)."
            exit 1
          fi
          gh workflow run ci.yml --ref main
