spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ascension_db}
    username: ${SPRING_DATASOURCE_USERNAME:ascension}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithm: HS256
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  fatsecret:
    client-id: ${FATSECRET_CLIENT_ID:CHANGE_ME}
    client-secret: ${FATSECRET_CLIENT_SECRET:CHANGE_ME}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:CHANGE_ME}
    vapid-private-key: ${VAPID_PRIVATE_KEY:CHANGE_ME}
    vapid-subject: ${VAPID_SUBJECT:mailto:CHANGE_ME@example.com}


google:
  client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME}





