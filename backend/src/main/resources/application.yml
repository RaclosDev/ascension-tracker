spring:
  cache:
    cache-names: foodSearch
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ascension_db}
    username: ${SPRING_DATASOURCE_USERNAME:ascension}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      max-lifetime: 600000
      keepalive-time: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 200
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithm: HS256

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: ${TOMCAT_INTERNAL_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

app:
  rate-limit:
    login-limit: ${RATE_LIMIT_LOGIN:20}
    refresh-limit: ${RATE_LIMIT_REFRESH:30}
    logout-limit: ${RATE_LIMIT_LOGOUT:30}
    import-limit: ${RATE_LIMIT_IMPORT:5}
    restore-limit: ${RATE_LIMIT_RESTORE:5}
    export-limit: ${RATE_LIMIT_EXPORT:10}
    user-write-limit: ${RATE_LIMIT_USER_WRITE:60}
    user-limit: ${RATE_LIMIT_USER:10}
    ai-limit: ${RATE_LIMIT_AI:20}
    food-external-limit: ${RATE_LIMIT_FOOD_EXTERNAL:20}
    push-limit: ${RATE_LIMIT_PUSH:20}
    max-requests-per-minute: ${RATE_LIMIT_GENERAL:20}
  quotas:
    max-workouts: ${QUOTA_MAX_WORKOUTS:3000}
    max-food-logs: ${QUOTA_MAX_FOOD_LOGS:25000}
    max-recipes: ${QUOTA_MAX_RECIPES:500}
    max-custom-exercises: ${QUOTA_MAX_CUSTOM_EXERCISES:500}
    max-workout-templates: ${QUOTA_MAX_WORKOUT_TEMPLATES:200}
    max-saved-foods: ${QUOTA_MAX_SAVED_FOODS:500}
    max-weight-entries: ${QUOTA_MAX_WEIGHT_ENTRIES:2000}
    max-steps-entries: ${QUOTA_MAX_STEPS_ENTRIES:2000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    refresh-grace-seconds: ${REFRESH_GRACE_SECONDS:300}
  cookie:
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ascension.raclos.es}
  fatsecret:
    client-id: ${FATSECRET_CLIENT_ID}
    client-secret: ${FATSECRET_CLIENT_SECRET}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY}
    vapid-private-key: ${VAPID_PRIVATE_KEY}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
    http-timeout-sec: ${PUSH_HTTP_TIMEOUT_SEC:10}
    timer-poll-delay-ms: ${PUSH_TIMER_POLL_DELAY_MS:1000}
  external-api:
    fatsecret:
      max-attempts: ${FATSECRET_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${FATSECRET_INITIAL_BACKOFF_MS:100}
      connect-timeout-ms: ${FATSECRET_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${FATSECRET_READ_TIMEOUT_MS:15000}
    gemini:
      max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${GEMINI_INITIAL_BACKOFF_MS:150}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
    google:
      max-attempts: ${GOOGLE_MAX_ATTEMPTS:1}
      initial-backoff-ms: ${GOOGLE_INITIAL_BACKOFF_MS:0}
      connect-timeout-ms: ${GOOGLE_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOOGLE_READ_TIMEOUT_MS:5000}


google:
  client-id: ${GOOGLE_CLIENT_ID}






