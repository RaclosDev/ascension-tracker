spring:
  cache:
    cache-names: foodSearch
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ascension_db}
    username: ${SPRING_DATASOURCE_USERNAME:ascension}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 200
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithm: HS256

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  fatsecret:
    client-id: ${FATSECRET_CLIENT_ID:CHANGE_ME_PLEASE_TO_A_32_BYTE_STRING_FOR_PROD}
    client-secret: ${FATSECRET_CLIENT_SECRET:CHANGE_ME_PLEASE_TO_A_32_BYTE_STRING_FOR_PROD}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY}
    vapid-private-key: ${VAPID_PRIVATE_KEY}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}


google:
  client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME_PLEASE_TO_A_32_BYTE_STRING_FOR_PROD}






