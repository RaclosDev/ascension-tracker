<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ascension">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Ascension">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Ascension: Seguimiento de peso, nutrición y progreso hacia tu objetivo.">
  <title>Ascension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/pwa-logo.png" as="image">
  <link rel="preload" href="/ascension-title.png" as="image">
  <!-- Precarga síncrona del color de tema para evitar flash -->
  <script>
    (function() {
      try {
        var hex = localStorage.getItem('ascension_custom_color');
        if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        function adj(h, p) {
          var _r = parseInt(h.slice(1,3),16), _g = parseInt(h.slice(3,5),16), _b = parseInt(h.slice(5,7),16);
          _r = Math.min(255, Math.max(0, _r + Math.round(255*(p/100))));
          _g = Math.min(255, Math.max(0, _g + Math.round(255*(p/100))));
          _b = Math.min(255, Math.max(0, _b + Math.round(255*(p/100))));
          return '#' + _r.toString(16).padStart(2,'0') + _g.toString(16).padStart(2,'0') + _b.toString(16).padStart(2,'0');
        }
        var s = document.documentElement.style;
        s.setProperty('--accent-primary', hex);
        s.setProperty('--accent-primary-light', adj(hex, 15));
        s.setProperty('--accent-primary-dark', adj(hex, -15));
        s.setProperty('--accent-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.15)');
        s.setProperty('--accent-shadow', 'rgba(' + r + ',' + g + ',' + b + ',0.4)');
        s.setProperty('--gradient-primary', 'linear-gradient(135deg,' + hex + ',' + adj(hex, -15) + ')');
        var yiq = (r*299 + g*587 + b*114) / 1000;
        s.setProperty('--accent-text', yiq >= 128 ? '#111111' : '#ffffff');
      } catch(e) {}
    })();
  </script>
  <script src="/pwa-recovery.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
