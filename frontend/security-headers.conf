# Cabeceras de seguridad para las respuestas ESTATICAS del frontend.
#
# IMPORTANTE: en nginx, si un bloque `location` declara su propio add_header,
# NO hereda los add_header del nivel `server`. Por eso este fichero se incluye
# explicitamente dentro de cada location estatica (ver nginx.conf).
# Las respuestas de /api/ las firma Spring Security, no se tocan aqui.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La app usa camara (escaner de codigo de barras) y microfono (voz a texto).
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

# HSTS: activalo cuando estes seguro de que SIEMPRE se sirve por HTTPS
# (el navegador lo recordara durante el max-age).
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP en modo ESTRICTO:
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
